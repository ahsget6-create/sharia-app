<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الاختبارات والتقييمات - متون طالب العلم</title>
  <style>
    :root { --bg:#101820; --panel:#182630; --panel2:#203440; --text:#f2f5f3; --muted:#b8c7c7; --accent:#c5a66a; --border:rgba(255,255,255,.1); --green:#45b58a; --red:#d97979; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Tahoma,Arial,sans-serif; line-height:1.8; }
    header { padding:16px 5%; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; background:var(--panel); border-bottom:1px solid var(--border); }
    header h1 { margin:0; color:var(--accent); font-size:1.25rem; }
    a { color:inherit; text-decoration:none; }
    .back { border:1px solid var(--border); border-radius:9px; padding:7px 13px; }
    main { width:min(820px,94%); margin:30px auto; }
    .intro,.quiz-box,.result-box { background:var(--panel); border:1px solid var(--border); border-radius:15px; padding:22px; }
    .intro { text-align:center; margin-bottom:18px; }
    .intro h2 { margin:0 0 7px; color:var(--accent); }
    .intro p { margin:0; color:var(--muted); }
    .quiz-top { display:flex; justify-content:space-between; gap:10px; color:var(--muted); margin-bottom:10px; }
    .progress { height:7px; background:#0c141a; border-radius:10px; overflow:hidden; margin-bottom:24px; }
    .progress div { height:100%; width:0; background:var(--green); transition:width .2s; }
    #question { font-size:1.2rem; margin:0 0 18px; }
    #options { display:grid; gap:11px; }
    .option { width:100%; text-align:right; padding:13px 15px; border:1px solid var(--border); border-radius:10px; background:var(--panel2); color:var(--text); cursor:pointer; }
    .option:hover:not(:disabled) { border-color:var(--accent); }
    .option.selected { border-color:var(--accent); background:#344454; }
    .option.correct { border-color:var(--green); background:#183b32; }
    .option.wrong { border-color:var(--red); background:#452a30; }
    .actions { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:22px; }
    button.primary { border:0; border-radius:9px; padding:10px 22px; background:var(--accent); color:#171717; font-weight:bold; cursor:pointer; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #feedback { min-height:28px; color:var(--muted); margin-top:13px; }
    .result-box { text-align:center; }
    .result-box h2 { color:var(--accent); }
    .score { font-size:2.3rem; color:var(--green); font-weight:bold; }
    .hidden { display:none; }
    @media(max-width:520px) { header { justify-content:center; } .quiz-top { font-size:.9rem; } }
  </style>
</head>
<body>
  <header>
    <a class="back" href="mutun.html">العودة إلى المتون</a>
    <h1>📝 الاختبارات والتقييمات</h1>
    <a class="back" href="index.html">الرئيسية</a>
  </header>
  <main>
    <section class="intro">
      <h2>اختبر معلوماتك</h2>
      <p>أجب عن الأسئلة ثم شاهد نتيجتك في نهاية الاختبار.</p>
    </section>

    <section class="quiz-box" id="quizBox">
      <div class="quiz-top"><span id="questionCounter">السؤال 1 من 30</span><span id="scoreCounter">الصحيحة: 0</span></div>
      <div class="progress"><div id="progressBar"></div></div>
      <h2 id="question"></h2>
      <div id="options"></div>
      <div id="feedback" aria-live="polite"></div>
      <div class="actions">
        <span id="answeredCount">تمت الإجابة: 0</span>
        <button class="primary" id="nextButton" disabled type="button">السؤال التالي</button>
      </div>
    </section>

    <section class="result-box hidden" id="resultBox">
      <h2>نتيجة الاختبار</h2>
      <div class="score" id="finalScore">0 / 30</div>
      <p id="resultMessage"></p>
      <button class="primary" id="restartButton" type="button">إعادة الاختبار</button>
      <p><a class="back" href="mutun.html">العودة إلى قائمة المتون</a></p>
    </section>
  </main>

  <script>
    // مجموعة أسئلة تدريبية عامة؛ يمكن استبدال نصوصها بأسئلتك الأصلية عند دمج النسخة النهائية.
    const questions = [
      {q:"ما أول واجب على العباد؟",o:["معرفة الله","الصلاة","الصوم","الحج"],a:0},
      {q:"كم عدد أركان الإسلام؟",o:["ثلاثة","أربعة","خمسة","ستة"],a:2},
      {q:"كم عدد أركان الإيمان؟",o:["خمسة","ستة","سبعة","ثمانية"],a:1},
      {q:"ما الكتاب الذي أنزل على محمد ﷺ؟",o:["التوراة","الإنجيل","الزبور","القرآن"],a:3},
      {q:"ما السورة التي تسمى أم الكتاب؟",o:["البقرة","الفاتحة","الإخلاص","الناس"],a:1},
      {q:"كم عدد سور القرآن الكريم؟",o:["110","112","114","116"],a:2},
      {q:"ما معنى التوحيد؟",o:["إفراد الله بالعبادة","كثرة المال","ترك العمل","مجرد المعرفة"],a:0},
      {q:"ما ضد التوحيد؟",o:["الإحسان","الشكر","الشرك","الصبر"],a:2},
      {q:"كم عدد أركان الصلاة؟",o:["أربعة عشر","عشرة","اثنا عشر","خمسة"],a:0},
      {q:"ما مفتاح الصلاة؟",o:["التسليم","الطهارة","الأذان","الدعاء"],a:1},
      {q:"ما أول أركان الإسلام؟",o:["الصلاة","الزكاة","الشهادتان","الصوم"],a:2},
      {q:"في أي شهر يصوم المسلمون؟",o:["شعبان","رمضان","شوال","محرم"],a:1},
      {q:"كم صلاة مفروضة في اليوم والليلة؟",o:["ثلاث","أربع","خمس","ست"],a:2},
      {q:"ما قبلة المسلمين؟",o:["المسجد النبوي","المسجد الأقصى","الكعبة","جبل عرفات"],a:2},
      {q:"من خاتم الأنبياء؟",o:["إبراهيم عليه السلام","موسى عليه السلام","عيسى عليه السلام","محمد ﷺ"],a:3},
      {q:"ما اسم أم القرآن؟",o:["سورة البقرة","سورة الفاتحة","سورة الملك","سورة الكهف"],a:1},
      {q:"ما حكم بر الوالدين؟",o:["مستحب فقط","واجب","مكروه","مباح"],a:1},
      {q:"ما ضد الصدق؟",o:["الأمانة","العدل","الكذب","الوفاء"],a:2},
      {q:"ما المقصود بالإحسان في حديث جبريل؟",o:["أن تعبد الله كأنك تراه","كثرة المال","السفر","الصمت"],a:0},
      {q:"ما عدد أشهر السنة الهجرية؟",o:["عشرة","أحد عشر","اثنا عشر","ثلاثة عشر"],a:2},
      {q:"ما أول شهر في السنة الهجرية؟",o:["صفر","محرم","ربيع الأول","رمضان"],a:1},
      {q:"ما الليلة التي هي خير من ألف شهر؟",o:["ليلة النصف من شعبان","ليلة القدر","ليلة العيد","ليلة الجمعة"],a:1},
      {q:"ما اسم الملك الموكل بالوحي؟",o:["ميكائيل","إسرافيل","جبريل","ملك الموت"],a:2},
      {q:"ما السورة التي لا تبدأ بالبسملة؟",o:["الأنفال","التوبة","يونس","هود"],a:1},
      {q:"كم عدد أجزاء القرآن؟",o:["20","25","30","40"],a:2},
      {q:"ما حكم الصلاة المفروضة؟",o:["سنة","فرض عين","فرض كفاية","مباح"],a:1},
      {q:"ما معنى السنة النبوية؟",o:["ما أضيف إلى النبي ﷺ من قول أو فعل أو تقرير أو صفة","أقوال العلماء فقط","العادات الاجتماعية","التاريخ"],a:0},
      {q:"ما العلم الذي يبحث في أحوال رواة الحديث؟",o:["النحو","مصطلح الحديث","الفرائض","البلاغة"],a:1},
      {q:"ما العلم الذي يدرس أحكام المواريث؟",o:["التفسير","العقيدة","الفرائض","السيرة"],a:2},
      {q:"ما المقصد من طلب العلم الشرعي؟",o:["الجدال","الشهرة","العمل بما يرضي الله","المباهاة"],a:2}
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;
    let answered = false;

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const nextButton = document.getElementById('nextButton');

    function loadQuestion() {
      const item = questions[currentQuestion];
      selectedAnswer = null;
      answered = false;
      document.getElementById('questionCounter').textContent = `السؤال ${currentQuestion + 1} من ${questions.length}`;
      document.getElementById('scoreCounter').textContent = `الصحيحة: ${score}`;
      document.getElementById('answeredCount').textContent = `تمت الإجابة: ${currentQuestion}`;
      document.getElementById('progressBar').style.width = `${currentQuestion / questions.length * 100}%`;
      questionEl.textContent = item.q;
      optionsEl.replaceChildren();
      document.getElementById('feedback').textContent = '';
      nextButton.disabled = true;
      nextButton.textContent = currentQuestion === questions.length - 1 ? 'عرض النتيجة' : 'السؤال التالي';

      item.o.forEach((option, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option';
        button.textContent = `${['أ','ب','ج','د'][index]}. ${option}`;
        button.addEventListener('click', () => chooseAnswer(index));
        optionsEl.appendChild(button);
      });
    }

    function chooseAnswer(index) {
      if (answered) return;
      answered = true;
      selectedAnswer = index;
      const correct = questions[currentQuestion].a;
      if (index === correct) score++;
      [...optionsEl.children].forEach((button, i) => {
        button.disabled = true;
        if (i === correct) button.classList.add('correct');
        else if (i === selectedAnswer) button.classList.add('wrong');
      });
      document.getElementById('feedback').textContent = index === correct ? 'إجابة صحيحة، أحسنت!' : 'ليست الإجابة الصحيحة. راجع الإجابة المظللة.';
      document.getElementById('scoreCounter').textContent = `الصحيحة: ${score}`;
      document.getElementById('answeredCount').textContent = `تمت الإجابة: ${currentQuestion + 1}`;
      nextButton.disabled = false;
    }

    function showResults() {
      document.getElementById('quizBox').classList.add('hidden');
      document.getElementById('resultBox').classList.remove('hidden');
      document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;
      const percentage = score / questions.length * 100;
      document.getElementById('resultMessage').textContent =
        percentage >= 80 ? 'ممتاز! واصل المراجعة والتعلم.' :
        percentage >= 60 ? 'جيد، راجع ما فاتك واستمر.' :
        'لا بأس، أعد المراجعة وحاول مرة أخرى.';
    }

    nextButton.addEventListener('click', () => {
      if (!answered) return;
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        loadQuestion();
      } else {
        showResults();
      }
    });

    document.getElementById('restartButton').addEventListener('click', () => {
      currentQuestion = 0;
      score = 0;
      document.getElementById('quizBox').classList.remove('hidden');
      document.getElementById('resultBox').classList.add('hidden');
      loadQuestion();
    });

    loadQuestion();
  </script>
</body>
</html>

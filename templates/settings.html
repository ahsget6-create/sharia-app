<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات</title>
  <style>
    :root { --bg:#101827; --panel:#182438; --text:#f3f5f8; --muted:#b7c2d2; --accent:#d6ad62; --border:#34445d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Tahoma,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.8; transition:background .2s,color .2s; }
    header { text-align:center; padding:32px 16px; background:#1b2b42; border-bottom:1px solid var(--border); }
    header h1 { color:var(--accent); margin:0; }
    main { width:min(760px,92%); margin:28px auto 55px; }
    .setting { background:var(--panel); border:1px solid var(--border); border-radius:13px; padding:19px; margin:15px 0; }
    .setting h2 { margin:0 0 5px; font-size:19px; }
    .setting p { color:var(--muted); margin:0 0 13px; font-size:14px; }
    select,button { font:inherit; border-radius:8px; padding:9px 13px; }
    select { background:#26364d; color:var(--text); border:1px solid var(--border); min-width:130px; }
    button { background:var(--accent); color:#1b1b1b; border:0; cursor:pointer; font-weight:bold; }
    .switch { display:flex; align-items:center; gap:10px; }
    .switch input { width:19px; height:19px; accent-color:var(--accent); }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
    .secondary { background:#293a52; color:var(--text); border:1px solid var(--border); }
    #toast { color:var(--accent); min-height:28px; margin-top:12px; }
    body.light { --bg:#f3f5f8; --panel:#fff; --text:#202938; --muted:#5d6878; --border:#d6dce5; background:var(--bg); color:var(--text); }
    body.light header { background:#e7edf5; }
    body.light select { background:#fff; color:#202938; }
    body.light .secondary { background:#e7edf5; color:#202938; }
  </style>
</head>
<body>
  <header>
    <h1>⚙️ الإعدادات</h1>
    <p>خصص طريقة عرض منصة العلوم الشرعية والتنبيهات</p>
  </header>
  <main>
    <section class="setting">
      <h2>المظهر</h2>
      <p>اختر المظهر المناسب للقراءة.</p>
      <button type="button" id="themeButton" onclick="toggleTheme()">تبديل الوضع الفاتح / الداكن</button>
    </section>

    <section class="setting">
      <h2>حجم الخط</h2>
      <p>تحكم في حجم النصوص داخل صفحات المنصة.</p>
      <select id="fontSize" onchange="applyFontSize(this.value)">
        <option value="14px">صغير</option>
        <option value="16px" selected>متوسط</option>
        <option value="19px">كبير</option>
      </select>
    </section>

    <section class="setting">
      <h2>التذكير اليومي</h2>
      <p>السماح للمنصة بإظهار تذكير يومي في الأوقات المحددة إذا كانت الصفحة مفتوحة وإذن الإشعارات متاحًا.</p>
      <label class="switch">
        <input type="checkbox" id="reminderToggle">
        <span>تفعيل التذكير اليومي</span>
      </label>
    </section>

    <div class="actions">
      <button type="button" onclick="saveSettings()">حفظ الإعدادات</button>
      <button type="button" class="secondary" onclick="resetSettings()">استعادة الافتراضي</button>
      <a href="/" style="align-self:center;color:var(--accent);text-decoration:none">العودة للرئيسية</a>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    const fontSelect = document.getElementById('fontSize');
    const reminderToggle = document.getElementById('reminderToggle');

    function toggleTheme() {
      document.body.classList.toggle('light');
      localStorage.setItem('siteTheme', document.body.classList.contains('light') ? 'light' : 'dark');
    }

    function applyFontSize(size) {
      document.documentElement.style.fontSize = size;
      localStorage.setItem('siteFontSize', size);
    }

    function loadSettings() {
      const theme = localStorage.getItem('siteTheme') || 'dark';
      document.body.classList.toggle('light', theme === 'light');
      const fontSize = localStorage.getItem('siteFontSize') || '16px';
      fontSelect.value = fontSize;
      document.documentElement.style.fontSize = fontSize;
      reminderToggle.checked = localStorage.getItem('dailyReminder') === 'true';
    }

    function saveSettings() {
      localStorage.setItem('dailyReminder', String(reminderToggle.checked));
      if (reminderToggle.checked && 'Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      document.getElementById('toast').textContent = 'تم حفظ الإعدادات على هذا الجهاز.';
    }

    function resetSettings() {
      localStorage.removeItem('siteTheme');
      localStorage.removeItem('siteFontSize');
      localStorage.removeItem('dailyReminder');
      loadSettings();
      document.getElementById('toast').textContent = 'تمت استعادة الإعدادات الافتراضية.';
    }

    // التذكير يعمل ما دامت الصفحة مفتوحة، ولا يضمن المتصفح إظهاره في الخلفية.
    function checkReminder() {
      if (localStorage.getItem('dailyReminder') !== 'true') return;
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const now = new Date();
      const stamp = now.toDateString() + '-' + now.getHours() + ':' + now.getMinutes();
      const last = localStorage.getItem('lastReminder');
      const times = [[5, 0], [18, 30]];
      if (times.some(([h, m]) => now.getHours() === h && now.getMinutes() === m) && last !== stamp) {
        new Notification('منصة العلوم الشرعية', { body: 'حان وقت الحفظ والمراجعة، وفقك الله.' });
        localStorage.setItem('lastReminder', stamp);
      }
    }

    loadSettings();
    setInterval(checkReminder, 60000);
  </script>
</body>
</html>

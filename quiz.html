<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبارات والتقييمات - متون طالب العلم</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #111827;
            --bg-card-hover: #1f2937;
            --primary-blue: #0ea5e9;
            --primary-teal: #10b981;
            --danger-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            direction: rtl;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Header --- */
        header {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .back-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.1);
        }

        .header-title h1 {
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Main Container --- */
        .main-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        /* Hero Card */
        .page-hero {
            background: linear-gradient(145deg, #111827 0%, #0f172a 100%);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 22px 18px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .page-hero h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        .page-hero p {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* --- Quiz Card --- */
        .quiz-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .quiz-progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-teal));
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 14px;
            text-align: right;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--bg-card-hover);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--primary-teal) !important;
            color: #34d399 !important;
            font-weight: 600;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--danger-red) !important;
            color: #fca5a5 !important;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-teal));
            color: #000;
            font-weight: 700;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* --- Result Screen --- */
        .result-box {
            text-align: center;
            display: none;
            padding: 20px 10px;
        }

        .result-score {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 14px 0;
        }

        .result-message {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .restart-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .restart-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>

            options: [

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        const q = questions[currentQuestionIndex];

        // تحديث شريط التقدم والعداد
        document.getElementById('questionCount').innerText = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
        document.getElementById('scoreTracker').innerText = `النقاط: ${score}`;
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;

        // عرض نص السؤال
        document.getElementById('questionText').innerText = q.question;

        // بناء الخيارات
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        document.getElementById('nextBtn').style.display = 'none';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, selectedBtn) {
        if (answered) return;
        answered = true;

        const q = questions[currentQuestionIndex];
        const allBtns = document.querySelectorAll('.option-btn');

        allBtns.forEach(btn => btn.disabled = true);

        if (selectedIndex === q.answer) {
            selectedBtn.classList.add('correct');
            score++;
            document.getElementById('scoreTracker').innerText = `النقاط: ${score}`;
        } else {
            selectedBtn.classList.add('wrong');
            allBtns[q.answer].classList.add('correct');
        }

        document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quizSection').style.display = 'none';
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('finalScore').innerText = `${score} / ${questions.length}`;

        const msg = document.getElementById('resultMessage');
        if (score === questions.length) {
            msg.innerText = "⭐ ماشاء الله لا قوة إلا بالله! إجابة كاملة وإتقان تام لمتون طالب العلم، أنت علامة متمكن!";
        } else if (score >= questions.length / 2) {
            msg.innerText = "👍 نتيجة رائعة جداً في اختبار عميق وصعب! مستواك العلمي متميز ومتقدم.";
        } else {
            msg.innerText = "📚 الاختبار كان دقيقاً وصعباً، تحتاج لمراجعة المتون وعقد مقارنات بين المسائل.";
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('quizSection').style.display = 'block';
        loadQuestion();
    }

    // تشغيل السؤال الأول عند تحميل الصفحة
    loadQuestion();
</script>

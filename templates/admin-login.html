<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة - منصة العلوم الشرعية</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0f172a;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            direction: rtl;
        }
        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #1e293b;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(0,0,0,.25);
        }
        h1 {
            margin: 0 0 10px;
            color: #38bdf8;
            font-size: 1.5rem;
            text-align: center;
        }
        .subtitle {
            margin: 0 0 26px;
            color: #94a3b8;
            text-align: center;
            font-size: .92rem;
        }
        label {
            display: block;
            margin-bottom: 9px;
            color: #e2e8f0;
            font-size: .95rem;
        }
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #475569;
            border-radius: 9px;
            outline: none;
            background: #0f172a;
            color: #fff;
            font: inherit;
        }
        input:focus { border-color: #38bdf8; }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #0284c7;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s;
        }
        button:hover { background: #0369a1; }
        .error {
            margin: 0 0 18px;
            padding: 10px 12px;
            border: 1px solid rgba(248,113,113,.35);
            border-radius: 8px;
            background: rgba(127,29,29,.25);
            color: #fca5a5;
            font-size: .9rem;
        }
    </style>
</head>
<body>
    <main class="login-box">
        <h1>لوحة تحكم الإدارة</h1>
        <p class="subtitle">منصة العلوم الشرعية</p>

        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <label for="password">كلمة مرور الإدارة</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="أدخل كلمة المرور"
                autocomplete="current-password"
                required
            >
            <button type="submit">تسجيل الدخول</button>
        </form>
    </main>
</body>
</html>

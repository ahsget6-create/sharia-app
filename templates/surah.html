<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض السورة القرآنية</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#101827;color:#f3f5f8;font-family:Tahoma,Arial,sans-serif;line-height:2}
    header{padding:25px 16px;text-align:center;background:#1a2a40;border-bottom:1px solid #354760}
    header h1{margin:0;color:#dfb96e;font-size:clamp(25px,4vw,36px)}
    header p{margin:5px 0 0;color:#bac6d6}
    main{width:min(950px,94%);margin:25px auto 55px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    a,button{font:inherit}
    a{color:#dfb96e;text-decoration:none}
    button{padding:8px 14px;border:1px solid #40536d;border-radius:8px;background:#22344d;color:#f3f5f8;cursor:pointer}
    button:disabled{opacity:.4;cursor:not-allowed}
    .info{background:#19283d;border:1px solid #354760;border-radius:12px;padding:14px;text-align:center;margin-bottom:18px;color:#bac6d6}
    .bismillah{text-align:center;color:#e4c17e;font-size:25px;margin:20px 0}
    .ayahs{background:#19283d;border:1px solid #354760;border-radius:15px;padding:25px}
    .ayah{padding:15px 5px;border-bottom:1px solid #354760;font-size:25px;line-height:2.2;text-align:justify}
    .ayah:last-child{border-bottom:0}
    .number{display:inline-flex;align-items:center;justify-content:center;border:1px solid #dfb96e;color:#dfb96e;border-radius:50%;width:32px;height:32px;font-size:14px;margin:0 7px}
    #status{text-align:center;padding:30px;color:#bac6d6}
    .error{color:#ff9c9c}
    .navigation{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
    @media(max-width:600px){.ayahs{padding:14px}.ayah{font-size:21px}}
  </style>
</head>
<body>
<header>
  <h1 id="surahName">القرآن الكريم</h1>
  <p id="surahMeta">جارٍ تحميل بيانات السورة...</p>
</header>
<main>
  <div class="toolbar">
    <a href="/quran.html">← فهرس السور</a>
    <a href="/">الصفحة الرئيسية</a>
  </div>
  <div id="status">جارٍ تحميل السورة...</div>
  <section id="content" hidden>
    <div class="info" id="info"></div>
    <div id="bismillah" class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <div id="ayahs" class="ayahs"></div>
    <div class="navigation">
      <button id="prev" type="button">السورة السابقة</button>
      <button id="next" type="button">السورة التالية</button>
    </div>
  </section>
</main>
<script>
  const params = new URLSearchParams(window.location.search);
  const surahId = Number(params.get('id'));
  let surahs = [];
  let currentIndex = -1;

  function showSurah(index) {
    if (index < 0 || index >= surahs.length) return;
    currentIndex = index;
    const surah = surahs[index];
    document.getElementById('surahName').textContent = surah.name || 'سورة';
    document.getElementById('surahMeta').textContent = `${surah.type || ''} · ${Array.isArray(surah.array) ? surah.array.length : 0} آية`;
    document.getElementById('info').textContent = `ترتيب السورة: ${surah.id} | عدد الآيات: ${Array.isArray(surah.array) ? surah.array.length : 0}`;
    document.getElementById('bismillah').hidden = Number(surah.id) === 1 || Number(surah.id) === 9;
    const container = document.getElementById('ayahs');
    container.replaceChildren();

    (Array.isArray(surah.array) ? surah.array : []).forEach((ayah, i) => {
      const paragraph = document.createElement('p');
      paragraph.className = 'ayah';
      paragraph.append(document.createTextNode(ayah.ar || ''));
      const number = document.createElement('span');
      number.className = 'number';
      number.textContent = ayah.id || i + 1;
      paragraph.append(number);
      container.appendChild(paragraph);
    });

    document.getElementById('prev').disabled = index === 0;
    document.getElementById('next').disabled = index === surahs.length - 1;
    document.getElementById('content').hidden = false;
    document.getElementById('status').hidden = true;
    history.replaceState(null, '', `?id=${encodeURIComponent(surah.id)}`);
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  document.getElementById('prev').addEventListener('click', () => showSurah(currentIndex - 1));
  document.getElementById('next').addEventListener('click', () => showSurah(currentIndex + 1));

  if (!Number.isInteger(surahId) || surahId < 1) {
    document.getElementById('status').textContent = 'رقم السورة غير صحيح. ارجع إلى فهرس السور واختر سورة.';
    document.getElementById('status').classList.add('error');
  } else {
    fetch('/Quran.json')
      .then(response => {
        if (!response.ok) throw new Error('تعذر تحميل ملف Quran.json.');
        return response.json();
      })
      .then(data => {
        if (!Array.isArray(data)) throw new Error('صيغة ملف بيانات القرآن غير صحيحة.');
        surahs = data;
        const index = surahs.findIndex(s => Number(s.id) === surahId);
        if (index === -1) throw new Error('لم يتم العثور على السورة المطلوبة.');
        showSurah(index);
      })
      .catch(error => {
        document.getElementById('status').textContent = error.message;
        document.getElementById('status').classList.add('error');
      });
  }
</script>
</body>
</html>
